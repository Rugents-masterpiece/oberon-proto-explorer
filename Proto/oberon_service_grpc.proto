message PrintReceiptResponse {
  bool success = 1;
  string message = 2;
}

message CashRegisterTransaction {
  string id = 1;
  string number = 2;
  OberonDateTime date = 3;
  DecimalValue totalAmount = 4;
  string status = 5;
  string bpId = 6;
  repeated CashRegisterTransactionLine lines = 7;
  repeated Payment payments = 8;
  OberonDateTime created = 9;
  OberonDateTime modified = 10;
}

message CashRegisterTransactionLine {
  string id = 1;
  string transactionId = 2;
  string productId = 3;
  string productName = 4;
  DecimalValue quantity = 5;
  DecimalValue unitPrice = 6;
  DecimalValue totalAmount = 7;
  DecimalValue taxRate = 8;
  DecimalValue taxAmount = 9;
}

message Payment {
  string id = 1;
  string type = 2;
  DecimalValue amount = 3;
  string currency = 4;
  string reference = 5;
