syntax = "proto3";

package oberon.servicegateway;

option csharp_namespace = "Exa.OBERON.ServiceGateway.Contracts";

// ============================================================================
// Core Value Types
// ============================================================================

message OberonDateTime {
  string value = 1;
}

message Money {
  string value = 1;
}

message DecimalValue {
  string value = 1;
}

message GuidValue {
  string value = 1;
}

message LongId {
  int64 value = 1;
}

message IntId {
  int32 value = 1;
}

message StringId {
  string value = 1;
}

// ============================================================================
// Record Base Info
// ============================================================================

message RecordBaseInfo {
  string guid = 1;
  int64 idNum = 2;
  string info = 3;
  string value = 4;
}

// ============================================================================
// Pagination
// ============================================================================

message PaginationRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string sortBy = 3;
  bool sortOrderAscending = 4;
}

message PaginationResponse {
  int32 totalCount = 1;
  int32 page = 2;
  int32 pageSize = 3;
  int32 totalPages = 4;
}

// ============================================================================
// Error Response
// ============================================================================

message ErrorResponse {
  string code = 1;
  string message = 2;
  repeated string details = 3;
  string correlationId = 4;
}

// ============================================================================
// System Info
// ============================================================================

message VersionInfo {
  string version = 1;
  string buildDate = 2;
  string environment = 3;
  string serverName = 4;
}

// ============================================================================
// Ping/Pong
// ============================================================================

message PingRequest {
  string message = 1;
}

message PingResponse {
  string message = 1;
}

// ============================================================================
// Version Request
// ============================================================================

message VersionRequest {
}

// ============================================================================
// Server Info
// ============================================================================

message ServerInfoRequest {
}

message ServerInfoResponse {
  string serverName = 1;
  string version = 2;
  string environment = 3;
  OberonDateTime uptime = 4;
  int32 activeConnections = 5;
  int64 totalRequests = 6;
  int64 failedRequests = 7;
  double cpuUsage = 8;
  int64 memoryUsage = 9;
  int64 memoryLimit = 10;
}

// ============================================================================
// Health Check
// ============================================================================

message HealthCheckRequest {
}

message HealthCheckResponse {
  bool healthy = 1;
  string status = 2;
  string message = 3;
  OberonDateTime timestamp = 4;
}

// ============================================================================
// Authentication
// ============================================================================

message AuthenticateRequest {
  string username = 1;
  string password = 2;
  string clientId = 3;
  string branchName = 4;
  string terminalId = 5;
}

message AuthenticateResponse {
  bool success = 1;
  string token = 2;
  string sessionId = 3;
  OberonDateTime expiresAt = 4;
  UserInfo user = 5;
  string correlationId = 6;
}

message RefreshTokenRequest {
  string token = 1;
}

message RefreshTokenResponse {
  bool success = 1;
  string token = 2;
  string sessionId = 3;
  OberonDateTime expiresAt = 4;
}

message ValidateTokenRequest {
  string token = 1;
}

message ValidateTokenResponse {
  bool isValid = 1;
  string userId = 2;
  string username = 3;
  string sessionId = 4;
  OberonDateTime expiresAt = 5;
}

message LogoutRequest {
  string sessionId = 1;
}

message LogoutResponse {
  bool success = 1;
}

message GetSessionInfoRequest {
  string sessionId = 1;
}

message GetSessionInfoResponse {
  string sessionId = 1;
  string userId = 2;
  string username = 3;
  OberonDateTime issuedAt = 4;
  OberonDateTime expiresAt = 5;
  bool isActive = 6;
  UserInfo user = 7;
}

message UserInfo {
  string userId = 1;
  string username = 2;
  string displayName = 3;
  string email = 4;
  repeated string roles = 5;
  repeated string permissions = 6;
}

// ============================================================================
// User Management
// ============================================================================

message GetUserInfoRequest {
  string userId = 1;
}

message GetUserInfoResponse {
  UserInfo user = 1;
  bool success = 2;
  string message = 3;
}

message SearchUsersRequest {
  string searchTerm = 1;
  int32 pageSize = 2;
  int32 pageNumber = 3;
}

message SearchUsersResponse {
  repeated UserInfo users = 1;
  PaginationResponse pagination = 2;
}

// ============================================================================
// Business Partner
// ============================================================================

message GetBusinessPartnerRequest {
  string bpId = 1;
  string identificationNumber = 2;
  optional BackendTarget target_backend = 3; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message GetBusinessPartnerResponse {
  BusinessPartner businessPartner = 1;
  bool success = 2;
  string message = 3;
}

message SearchBusinessPartnersRequest {
  string searchTerm = 1;
  int32 pageSize = 2;
  int32 pageNumber = 3;
  optional BackendTarget target_backend = 4; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message SearchBusinessPartnersResponse {
  repeated BusinessPartner businessPartners = 1;
  PaginationResponse pagination = 2;
}

// ============================================================================
// Business Partner - Find (Search)
// ============================================================================

message FindMethod {
  int32 value = 1;
}

message FindBusinessPartnersRequest {
  string findValue = 1;
  FindMethod findMethod = 2;
  bool getBranches = 3;
  int32 getBranchesFilter = 4;
  int32 getFileRepositoryBinaryDataMode = 5;
  int32 getFileRepositoryBinaryDataFilterIDNums = 6;
  optional BackendTarget target_backend = 7; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message FindBusinessPartnersResponse {
  repeated BusinessPartner businessPartners = 1;
  PaginationResponse pagination = 2;
}

// ============================================================================
// Business Partner - List (Paginated)
// ============================================================================

message ListBusinessPartnersRequest {
  int32 page = 1;
  int32 pageSize = 2;
  string sortBy = 3;
  bool sortOrderAscending = 4;
  string filter = 5;
  optional BackendTarget target_backend = 6; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message ListBusinessPartnersResponse {
  repeated BusinessPartner businessPartners = 1;
  PaginationResponse pagination = 2;
}

// ============================================================================
// Business Partner - List Settings
// ============================================================================

message GetBusinessPartnerListSettingsRequest {
  optional BackendTarget target_backend = 1; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message GetBusinessPartnerListSettingsResponse {
  repeated string columns = 1;
  repeated string specialFilters = 2;
}

// ============================================================================
// Business Partner - Groups
// ============================================================================

message ListBusinessPartnerGroupsRequest {
  optional BackendTarget target_backend = 1; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message ListBusinessPartnerGroupsResponse {
  repeated BusinessPartnerGroup businessPartnerGroups = 1;
}

message BusinessPartnerGroup {
  string id = 1;
  string name = 2;
  string code = 3;
  bool isActive = 4;
}

message BusinessPartner {
  string id = 1;
  string code = 2;
  string name = 3;
  string ico = 4;
  string dic = 5;
  string icDph = 6;
  string address = 7;
  string city = 8;
  string postalCode = 9;
  string country = 10;
  string phone = 11;
  string email = 12;
  string website = 13;
  string contactPerson = 14;
  string bankAccount = 15;
  string bankCode = 16;
  string note = 17;
  bool isActive = 18;
}

// ============================================================================
// Business Partner - Credit Limit
// ============================================================================

message GetBusinessPartnerCreditLimitRequest {
  string identificationNumber = 1;
  optional BackendTarget target_backend = 2; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message GetBusinessPartnerCreditLimitResponse {
  bool isExceeded = 1;
  DecimalValue allowedValue = 2;
  DecimalValue configuredValue = 3;
  string businessPartnerIdentificationNumber = 4;
  string businessPartnerName = 5;
  repeated string turnoverInfo = 6;
  repeated string overdueInfo = 7;
}

// ============================================================================
// Business Partner - Add
// ============================================================================

message AddBusinessPartnerRequest {
  BusinessPartner businessPartner = 1;
  optional BackendTarget target_backend = 2; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message AddBusinessPartnerResponse {
  RecordBaseInfo recordInfo = 1;
  bool success = 2;
  string message = 3;
}

// ============================================================================
// Business Partner - Update
// ============================================================================

message UpdateBusinessPartnerRequest {
  BusinessPartnerHeader header = 1;
  optional BackendTarget target_backend = 2; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message UpdateBusinessPartnerResponse {
  RecordBaseInfo recordInfo = 1;
  bool success = 2;
  string message = 3;
}

message BusinessPartnerHeader {
  string recordGuid = 1;
  string name = 2;
  string identificationNumber = 3;
  string identificationNumberTax = 4;
  string identificationNumberVat = 5;
  string address = 6;
  string city = 7;
  string postalCode = 8;
  string country = 9;
  string email = 10;
  string phone = 11;
  string web = 12;
  string contactPerson = 13;
  string bankAccount = 14;
  string bankCode = 15;
  string note = 16;
  bool isActive = 17;
}

// ============================================================================
// Business Partner - Delete
// ============================================================================

message DeleteBusinessPartnerRequest {
  string recordGuid = 1;
  string identificationNumber = 2;
  optional BackendTarget target_backend = 3; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message DeleteBusinessPartnerResponse {
  bool success = 1;
  string message = 2;
}

// ============================================================================
// Product
// ============================================================================

message GetProductRequest {
  string productId = 1;
  optional BackendTarget target_backend = 2;  // dual-backend routing: empty = Gen1 default; never silently re-routes
}
message GetProductResponse {
  Product product = 1;
  bool success = 2;
  string message = 3;
}

message SearchProductsRequest {
  string searchTerm = 1;
  int32 pageSize = 2;
  int32 pageNumber = 3;
  optional BackendTarget target_backend = 4;  // dual-backend routing: empty = Gen1 default; never silently re-routes
}
message SearchProductsResponse {
  repeated Product products = 1;
  PaginationResponse pagination = 2;
}

message Product {
  string id = 1;
  string name = 2;
  string code = 3;
  string description = 4;
  DecimalValue price = 5;
  string unit = 6;
  string category = 7;
  bool isActive = 8;
  OberonDateTime created = 9;
  OberonDateTime modified = 10;
}

// ============================================================================
// Stock
// ============================================================================


// Backend generation selector for dual-routed RPCs.
// UNSPECIFIED preserves status-quo routing (Gen1 for Stock). Selection NEVER re-routes implicitly:
// an unauthenticated requested backend fails explicitly (BackendNotAuthenticated).
enum BackendTarget {
  BACKEND_TARGET_UNSPECIFIED = 0;
  BACKEND_TARGET_GEN1 = 1;
  BACKEND_TARGET_GEN2 = 2;
}

message GetStockRequest {
  string productId = 1;
  string warehouseId = 2;
  optional BackendTarget target_backend = 3;  // dual-backend routing: empty = Gen1 default; never silently re-routes
}

message GetStockResponse {
  Stock stock = 1;
  bool success = 2;
  string message = 3;
}

message Stock {
  string productId = 1;
  string warehouseId = 2;
  DecimalValue quantity = 3;
  DecimalValue reservedQuantity = 4;
  DecimalValue availableQuantity = 5;
  OberonDateTime lastUpdated = 6;
}

// ============================================================================
// Document
// ============================================================================

message GetDocumentRequest {
  string documentId = 1;
}

message GetDocumentResponse {
  Document document = 1;
  bool success = 2;
  string message = 3;
}

message SearchDocumentsRequest {
  string searchTerm = 1;
  int32 pageSize = 2;
  int32 pageNumber = 3;
}

message SearchDocumentsResponse {
  repeated Document documents = 1;
  PaginationResponse pagination = 2;
}

message Document {
  string id = 1;
  string number = 2;
  string type = 3;
  string bpId = 4;
  OberonDateTime date = 5;
  DecimalValue totalAmount = 6;
  DecimalValue totalTax = 7;
  DecimalValue totalNet = 8;
  string currency = 9;
  string status = 10;
  repeated DocumentLine lines = 11;
  OberonDateTime created = 12;
  OberonDateTime modified = 13;
}

message DocumentLine {
  string id = 1;
  string documentId = 2;
  string productId = 3;
  string productName = 4;
  DecimalValue quantity = 5;
  DecimalValue unitPrice = 6;
  DecimalValue totalAmount = 7;
  DecimalValue taxRate = 8;
  DecimalValue taxAmount = 9;
}

// ============================================================================
// Invoice
// ============================================================================

message GetInvoiceRequest {
  string invoiceId = 1;
  optional BackendTarget target_backend = 2; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message GetInvoiceResponse {
  Invoice invoice = 1;
  bool success = 2;
  string message = 3;
}

message CreateInvoiceRequest {
  string bpId = 1;
  OberonDateTime date = 2;
  repeated InvoiceLine lines = 3;
  string currency = 4;
  string note = 5;
  optional BackendTarget target_backend = 6; // per-request Gen1/Gen2 selection (0/unspecified/1 = legacy path)
}

message CreateInvoiceResponse {
  string invoiceId = 1;
  bool success = 2;
  string message = 3;
}

message Invoice {
  string id = 1;
  string number = 2;
  string bpId = 3;
  OberonDateTime date = 4;
  DecimalValue totalAmount = 5;
  DecimalValue totalTax = 6;
  DecimalValue totalNet = 7;
  string currency = 8;
  string status = 9;
  repeated InvoiceLine lines = 10;
  string note = 11;
  OberonDateTime created = 12;
  OberonDateTime modified = 13;
}

message InvoiceLine {
  string id = 1;
  string invoiceId = 2;
  string productId = 3;
  string productName = 4;
  DecimalValue quantity = 5;
  DecimalValue unitPrice = 6;
  DecimalValue totalAmount = 7;
  DecimalValue taxRate = 8;
  DecimalValue taxAmount = 9;
}

// ============================================================================
// Cash Register
// ============================================================================

message GetCashRegisterTransactionRequest {
  string transactionId = 1;
}

message GetCashRegisterTransactionResponse {
  CashRegisterTransaction transaction = 1;
  bool success = 2;
  string message = 3;
}

message OpenCashDrawerRequest {
