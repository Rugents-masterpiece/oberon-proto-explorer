// ============================================================================
// Login pass-through messages (original G1/G2 login semantics)
message LoginSaltRequest {
  string username = 1;
}

message LoginSaltResponse {
  bool result = 1;
  string description = 2;
  string data = 3;
}

message LoginUserRequest {
  string username = 1;
  // Legacy field: Gen2-only password hash (SHA1(Gen2Salt+password)). NEVER used for Gen1.
  string passwordHash = 2;
  // Optional explicit per-backend hashes (dual-session login). Gen2PasswordHash takes
  // precedence over legacy passwordHash when both are supplied.
  string gen1PasswordHash = 3;
  string gen2PasswordHash = 4;
  // Optional CashRegister-Gen2 password hash (SHA1(CashRegisterGen2Salt+password), see
  // GetLoginSalts). Authenticates the third backend so CallCRG2Procedure can be used.
  string cashRegisterGen2PasswordHash = 5;
}

message LoginUserExRequest {
  string username = 1;
  // Legacy field: Gen2-only password hash. NEVER used for Gen1.
  string passwordHash = 2;
  string loginTag = 3;
  string gen1PasswordHash = 4;
  string gen2PasswordHash = 5;
  // Optional CashRegister-Gen2 password hash (see LoginUserRequest.cashRegisterGen2PasswordHash).
  string cashRegisterGen2PasswordHash = 6;
}

message LoginSaltsRequest {
  string username = 1;
}

message LoginSaltsResponse {
  bool result = 1;          // true when at least one backend produced a salt
  string description = 2;
  bool gen1Result = 3;
  string gen1Salt = 4;
  bool gen2Result = 5;
  string gen2Salt = 6;
  // CashRegister-Gen2 login salt (third backend). Empty/unset when CR-G2 is not configured.
  bool cashRegisterGen2Result = 7;
  string cashRegisterGen2Salt = 8;
}

message ProxyLoginResponse {
  bool result = 1;
  string description = 2;
  string sessionId = 3;
}

message IsLoginRequest {
  string sessionId = 1;
}

message IsLoginResponse {
  bool isLoggedIn = 1;
}

// Service Definition
// ============================================================================

service OBERONServiceGRPC {
  // System
  rpc Ping(PingRequest) returns (PingResponse);
  rpc GetVersion(VersionRequest) returns (VersionInfo);
  rpc GetDateTime(Empty) returns (OberonDateTime);
  rpc GetServerInfo(ServerInfoRequest) returns (ServerInfoResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  
  // Authentication
  rpc Authenticate(AuthenticateRequest) returns (AuthenticateResponse);
  rpc RefreshToken(RefreshTokenRequest) returns (RefreshTokenResponse);
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);

  // Login pass-through (identical semantics to the original Gen1/Gen2 web service login surface)
  rpc GetLoginSalt(LoginSaltRequest) returns (LoginSaltResponse);
  rpc GetLoginSalts(LoginSaltsRequest) returns (LoginSaltsResponse);
  rpc LoginUser(LoginUserRequest) returns (ProxyLoginResponse);
  rpc LoginUserEx(LoginUserExRequest) returns (ProxyLoginResponse);
  rpc IsLogin(IsLoginRequest) returns (IsLoginResponse);
  rpc GetSessionInfo(GetSessionInfoRequest) returns (GetSessionInfoResponse);
  
  // User Management
  rpc GetUserInfo(GetUserInfoRequest) returns (GetUserInfoResponse);
  rpc SearchUsers(SearchUsersRequest) returns (SearchUsersResponse);
  
  // Business Partner
  rpc GetBusinessPartner(GetBusinessPartnerRequest) returns (GetBusinessPartnerResponse);
  rpc SearchBusinessPartners(SearchBusinessPartnersRequest) returns (SearchBusinessPartnersResponse);
  rpc FindBusinessPartners(FindBusinessPartnersRequest) returns (FindBusinessPartnersResponse);
  rpc ListBusinessPartners(ListBusinessPartnersRequest) returns (ListBusinessPartnersResponse);
  rpc GetBusinessPartnerListSettings(GetBusinessPartnerListSettingsRequest) returns (GetBusinessPartnerListSettingsResponse);
  rpc ListBusinessPartnerGroups(ListBusinessPartnerGroupsRequest) returns (ListBusinessPartnerGroupsResponse);
  rpc GetBusinessPartnerCreditLimit(GetBusinessPartnerCreditLimitRequest) returns (GetBusinessPartnerCreditLimitResponse);
  rpc AddBusinessPartner(AddBusinessPartnerRequest) returns (AddBusinessPartnerResponse);
  rpc UpdateBusinessPartner(UpdateBusinessPartnerRequest) returns (UpdateBusinessPartnerResponse);
  rpc DeleteBusinessPartner(DeleteBusinessPartnerRequest) returns (DeleteBusinessPartnerResponse);
  
  // Product
  rpc GetProduct(GetProductRequest) returns (GetProductResponse);
  rpc SearchProducts(SearchProductsRequest) returns (SearchProductsResponse);
  
  // Stock
  rpc GetStock(GetStockRequest) returns (GetStockResponse);
  rpc GetStockCard(GetStockCardRequest) returns (GetStockCardResponse);
  rpc GetStockCardFind(GetStockCardFindRequest) returns (GetStockCardFindResponse);
  rpc GetStockCards(GetStockCardsRequest) returns (GetStockCardsResponse);
  rpc GetStockCardInventory(GetStockCardInventoryRequest) returns (GetStockCardInventoryResponse);
  rpc GetStockCardInventoryFind(GetStockCardInventoryFindRequest) returns (GetStockCardInventoryFindResponse);
  rpc GetStockBalance(GetStockBalanceRequest) returns (GetStockBalanceResponse);
  rpc GetStockCardAttributes(GetStockCardAttributesRequest) returns (GetStockCardAttributesResponse);
  rpc GetStockCardCustomerPrices(GetStockCardCustomerPricesRequest) returns (GetStockCardCustomerPricesResponse);
  rpc GetStockCardsTreeCategory(GetStockCardsTreeCategoryRequest) returns (GetStockCardsTreeCategoryResponse);
  rpc GetMovementDocumentTypes(GetMovementDocumentTypesRequest) returns (GetMovementDocumentTypesResponse);
  // Stock Card Write Operations (Proxy-only)
  rpc SetStockCard(SetStockCardRequest) returns (SetStockCardResponse);
  rpc DeleteStockCard(DeleteStockCardRequest) returns (DeleteStockCardResponse);
  
  // Company/Common
  rpc GetCompanyInfo(GetCompanyInfoRequest) returns (GetCompanyInfoResponse);
  rpc GetCompanySettings(GetCompanySettingsRequest) returns (GetCompanySettingsResponse);
  rpc GetCompanyBranches(GetCompanyBranchesRequest) returns (GetCompanyBranchesResponse);
  
  // Cash Register
  rpc GetCashRegisterTransaction(GetCashRegisterTransactionRequest) returns (GetCashRegisterTransactionResponse);
  rpc OpenCashDrawer(OpenCashDrawerRequest) returns (OpenCashDrawerResponse);
  rpc PrintReceipt(PrintReceiptRequest) returns (PrintReceiptResponse);
  rpc GetCashRegistersBillsOpen(GetCashRegistersBillsOpenRequest) returns (GetCashRegistersBillsOpenResponse);
  rpc GetCashRegistersTurnover(GetCashRegistersTurnoverRequest) returns (GetCashRegistersTurnoverResponse);
  rpc GetCashRegisterDailyBalanceHistory(GetCashRegisterDailyBalanceHistoryRequest) returns (GetCashRegisterDailyBalanceHistoryResponse);
  
  // Loyalty System
  rpc GetLoyaltyCard(GetLoyaltyCardRequest) returns (GetLoyaltyCardResponse);
  rpc AddLoyaltyPoints(AddLoyaltyPointsRequest) returns (AddLoyaltyPointsResponse);
  
  // Hotel
  rpc GetHotelRooms(GetHotelRoomsRequest) returns (GetHotelRoomsResponse);
  rpc GetHotelGuests(GetHotelGuestsRequest) returns (GetHotelGuestsResponse);
  rpc GetHotelRoomReservations(GetHotelRoomReservationsRequest) returns (GetHotelRoomReservationsResponse);
  
  // Food Menu
  rpc GetFoodMenuList(GetFoodMenuListRequest) returns (GetFoodMenuListResponse);
  rpc GetFoodMenuGroupList(GetFoodMenuGroupListRequest) returns (GetFoodMenuGroupListResponse);
  rpc GetFoodMenu(GetFoodMenuRequest) returns (GetFoodMenuResponse);
  
  // Document
  rpc GetDocument(GetDocumentRequest) returns (GetDocumentResponse);
  rpc SearchDocuments(SearchDocumentsRequest) returns (SearchDocumentsResponse);
  
  // Invoice
  rpc GetInvoice(GetInvoiceRequest) returns (GetInvoiceResponse);
  rpc CreateInvoice(CreateInvoiceRequest) returns (CreateInvoiceResponse);
  
  // Reports
  rpc GetReport(GetReportRequest) returns (GetReportResponse);
  
  // Settings
  rpc GetSettings(GetSettingsRequest) returns (GetSettingsResponse);
  rpc UpdateSetting(UpdateSettingRequest) returns (UpdateSettingResponse);
  
  // Server Management
  rpc GetTimestamp(GetTimestampRequest) returns (GetTimestampResponse);
  rpc GetServerTime(GetServerTimeRequest) returns (GetServerTimeResponse);
  rpc GetUptime(GetUptimeRequest) returns (GetUptimeResponse);
  rpc GetServerStatus(GetServerStatusRequest) returns (GetServerStatusResponse);
  rpc GetServerMetrics(GetServerMetricsRequest) returns (GetServerMetricsResponse);
  rpc GetServerLogs(GetServerLogsRequest) returns (GetServerLogsResponse);
  rpc GetServerConfig(GetServerConfigRequest) returns (GetServerConfigResponse);
  rpc GetServerFeatures(GetServerFeaturesRequest) returns (GetServerFeaturesResponse);
  rpc GetServerPlugins(GetServerPluginsRequest) returns (GetServerPluginsResponse);
  rpc GetServerModules(GetServerModulesRequest) returns (GetServerModulesResponse);
  rpc GetServerDependencies(GetServerDependenciesRequest) returns (GetServerDependenciesResponse);
  rpc GetServerEnvironment(GetServerEnvironmentRequest) returns (GetServerEnvironmentResponse);
  rpc GetServerProcessors(GetServerProcessorsRequest) returns (GetServerProcessorsResponse);
  rpc GetServerMemory(GetServerMemoryRequest) returns (GetServerMemoryResponse);
  rpc GetServerDisk(GetServerDiskRequest) returns (GetServerDiskResponse);
  rpc GetServerNetwork(GetServerNetworkRequest) returns (GetServerNetworkResponse);
  rpc GetServerServices(GetServerServicesRequest) returns (GetServerServicesResponse);
  rpc GetServerTasks(GetServerTasksRequest) returns (GetServerTasksResponse);
  rpc GetServerJobs(GetServerJobsRequest) returns (GetServerJobsResponse);
  rpc GetServerQueues(GetServerQueuesRequest) returns (GetServerQueuesResponse);
  rpc GetServerCache(GetServerCacheRequest) returns (GetServerCacheResponse);
  rpc GetServerConnections(GetServerConnectionsRequest) returns (GetServerConnectionsResponse);
  rpc GetServerSessions(GetServerSessionsRequest) returns (GetServerSessionsResponse);
  rpc GetServerEvents(GetServerEventsRequest) returns (GetServerEventsResponse);
  rpc GetServerNotifications(GetServerNotificationsRequest) returns (GetServerNotificationsResponse);
  rpc GetServerAlerts(GetServerAlertsRequest) returns (GetServerAlertsResponse);
  rpc GetServerWarnings(GetServerWarningsRequest) returns (GetServerWarningsResponse);
  rpc GetServerErrors(GetServerErrorsRequest) returns (GetServerErrorsResponse);
  rpc GetServerExceptions(GetServerExceptionsRequest) returns (GetServerExceptionsResponse);
  rpc GetServerStackTraces(GetServerStackTracesRequest) returns (GetServerStackTracesResponse);
  rpc GetServerThreads(GetServerThreadsRequest) returns (GetServerThreadsResponse);
  rpc GetServerHandles(GetServerHandlesRequest) returns (GetServerHandlesResponse);

  // Generic G2 (Gen2 REST) procedure passthrough. The procedure name is resolved strictly
  // against the server-owned G2ProcedureCatalog (all 110 deployed G2 web-service procedures).
  // Business failures are carried in the response fields (result/err_number/description),
  // not as gRPC status errors. Gateway-level failures (unknown procedure, missing session,
  // policy-blocked write, transport failure) use gRPC status codes.
  rpc CallG2Procedure(G2ProcedureCallRequest) returns (G2ProcedureCallResponse);

  // Generic, catalog-governed SOAP passthrough to the deployed OBERON G1 web services
  // against the server-owned G1ProcedureCatalog (all 166 documented G1 procedures:
  // 92 IOBERONService + 61 IOBERONCashRegisterService + 13 IOBERONLoyaltySystemService).
  // Business failures are carried in the response fields (result/err_number/description),
  // not as gRPC status errors. Gateway-level failures (unknown procedure, missing session,
  // blocked policy gate, transport fault) are raised as gRPC status errors.
  rpc CallG1Procedure(G1ProcedureCallRequest) returns (G1ProcedureCallResponse);

  // Introspection of the server-owned G1 procedure catalog (documentation surface for
  // GET /api/g1/procedures; gateway-local, no backend call).
  rpc ListG1Procedures(ListG1ProceduresRequest) returns (ListG1ProceduresResponse);

  // Generic CashRegister-Gen2 (IOBERONServiceCashRegisterGen2 REST) procedure passthrough.
  // The procedure name is resolved strictly against the server-owned CRG2ProcedureCatalog
  // (96 deployed CashRegister-Gen2 web-service procedures: 85 generic-callable + 11
  // gateway-session-owned). Requires an authenticated CashRegister-Gen2 backend session
  // (login with cashRegisterGen2PasswordHash, see GetLoginSalts.cashRegisterGen2Salt).
  // Business failures are carried in the response fields (result/err_number/description),
  // not as gRPC status errors. Gateway-level failures (unknown procedure, missing session,
  // policy-blocked write, transport fault) use gRPC status codes.
  rpc CallCRG2Procedure(CRG2ProcedureCallRequest) returns (CRG2ProcedureCallResponse);

  // Introspection of the server-owned CashRegister-Gen2 procedure catalog (documentation
  // surface; gateway-local, no backend call).
  rpc ListCRG2Procedures(ListCRG2ProceduresRequest) returns (ListCRG2ProceduresResponse);
}

message Empty {
}

message G2ProcedureCallRequest {
  // Exact G2 procedure name, e.g. "Stock_StockCard_Get". Case-sensitive; see docs/grpc-migration
  // /ServiceGateway_G2_ProcedureMatrix.md for the full list.
  string procedure = 1;
  // JSON object with the procedure arguments (field names documented per procedure).
  // Empty string or "{}" means argument-less call (GET / no-body procedures only).
  string json_payload = 2;
}

message G2ProcedureCallResponse {
  // G2 envelope result field: true = business success, false = business error
  // (then err_number/description are set). Missing envelope field => false.
  bool result = 1;
  // G2 envelope errNumber (0 when result=true).
  int32 err_number = 2;
  // G2 envelope description (localizable error text when result=false).
  string description = 3;
  // G2 envelope "data" member serialized as a JSON string ("null" when absent).
  string data_json = 4;
  // HTTP status code returned by the G2 REST endpoint (diagnostic only).
  int32 transport_status = 5;
}

// ============================================================================
// Generic G1 SOAP procedure passthrough (catalog-governed, see G1ProcedureCatalog)
// ============================================================================

message G1ProcedureCallRequest {
  // Exact G1 procedure name, e.g. "GetStock_StockCards" or, for a secondary interface,
  // the qualified form "IOBERONCashRegisterService.GetLicences". Case-sensitive;
  // see GET /api/g1/procedures (ListG1Procedures) for the exact catalog.
  string procedure = 1;
  // JSON object whose keys are the DOCUMENTED parameter names of the procedure
  // (scalars, DTOs by member name, arrays as JSON arrays). "{}" = argument-less call.
  // The gateway maps this onto the SOAP envelope using the server-owned catalog ONLY;
  // caller-supplied XML/actions/URLs are never possible.
  string json_payload = 2;
}

message G1ProcedureCallResponse {
  // G1 ResultValue envelope: true = business success, false = business error
  // (then err_number/description are set). Missing envelope fields => false.
  bool result = 1;
  // G1 envelope errNumber (see enm_Err_Basic; 0 when result=true).
  int32 err_number = 2;
  // G1 envelope description (localizable error text when result=false).
  string description = 3;
  // G1 envelope "data" member serialized as a JSON string ("null" when absent).
  // Operations returning Stream carry {"base64": "..."} here.
  // Operations with a bare (non-ResultValue) return are wrapped as {"value": "..."}.
  string data_json = 4;
  // Echo of the resolved catalog name (bare form, e.g. "GetLicences").
  string procedure = 5;
  // Echo of the owning G1 interface, e.g. "IOBERONService".
  string interface_name = 6;
  // HTTP status code returned by the G1 SOAP endpoint (diagnostic only).
  int32 transport_status = 7;
}

message ListG1ProceduresRequest {
  // Optional substring filter on procedure names (case-insensitive).
  string name_filter = 1;
  // Optional filter matching the interface name (e.g. "CashRegister").
  string interface_filter = 2;
  // Optional EXACT procedure name (case-insensitive equality; used by GET /api/g1/procedures/{name}).
  string exact_name = 3;
}

message G1ProcedureDescriptorMsg {
  string name = 1;
  // "IOBERONService" | "IOBERONCashRegisterService" | "IOBERONLoyaltySystemService".
  string interface_name = 2;
  // Declared parameter list "Type name, Type name" ("" = argument-less).
  string args = 3;
  // Declared return type, e.g. "ResultValue<StockCardData>".
  string returns = 4;
  // Read | Write | Destructive | SessionControl.
  string procedure_class = 5;
  // Native G1 WebHTTP verb metadata (GET|POST).
  string http_method = 6;
  // Native G1 WebHTTP URI template metadata.
  string uri_template = 7;
  // False for SessionControl procedures (gateway login surface owns those).
  bool generic_callable = 8;
  // Minimal JSON request example (documented parameters with zero values).
  string example_json = 9;
}

message ListG1ProceduresResponse {
  bool result = 1;
  // Total catalog size (independent of filters).
  int32 total = 2;
  repeated G1ProcedureDescriptorMsg procedures = 3;
}

// ============================================================================
// Generic CashRegister-Gen2 REST procedure passthrough (catalog-governed, see CRG2ProcedureCatalog)
// ============================================================================

message CRG2ProcedureCallRequest {
  // Exact CashRegister-Gen2 procedure name, e.g. "CashRegister_BillOpen_List". Case-sensitive;
  // see ListCRG2Procedures for the exact catalog.
  string procedure = 1;
  // JSON object with the procedure arguments (field names documented per procedure).
  // Empty string or "{}" means argument-less call (GET / no-body procedures only).
  string json_payload = 2;
}

message CRG2ProcedureCallResponse {
  // Backend envelope result field: true = business success, false = business error
  // (then err_number/description are set). Missing envelope field => false.
  bool result = 1;
  // Envelope errNumber (0 when result=true).
  int32 err_number = 2;
  // Envelope description (localizable error text when result=false).
  string description = 3;
  // Envelope "data" member serialized as a JSON string ("null" when absent).
  string data_json = 4;
  // HTTP status code returned by the CashRegister-Gen2 REST endpoint (diagnostic only).
  int32 transport_status = 5;
}

message ListCRG2ProceduresRequest {
  // Optional substring filter on procedure names (case-insensitive).
  string name_filter = 1;
  // Optional EXACT procedure name (case-insensitive equality).
  string exact_name = 2;
}

message CRG2ProcedureDescriptorMsg {
  string name = 1;
  // HTTP verb used by the deployed endpoint (Get | Post | Delete).
  string http_method = 2;
  // REST path relative to Gen2CashRegisterBaseAddress, e.g. "v1/cashregister/bill-open/list".
  string uri_template = 3;
  // Read | Write | Destructive | Session.
  string procedure_class = 4;
  // False for Session procedures (gateway session machinery owns those).
  bool generic_callable = 5;
}

message ListCRG2ProceduresResponse {
  bool result = 1;
  // Total catalog size (independent of filters).
  int32 total = 2;
  repeated CRG2ProcedureDescriptorMsg procedures = 3;
}
